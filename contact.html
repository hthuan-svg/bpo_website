<body data-page="contact">
  <div id="site-header"></div>
  <main id="main" class="contact-page">
    <div class="contact-banner"><img data-img="contact_banner" alt=""></div>
    <section class="contact-section section">
      <div class="container">
        <nav class="service-breadcrumb" data-i18n-attr="aria-label:ui.breadcrumb">
          <ol class="service-breadcrumb__list">
            <li class="service-breadcrumb__item"><a href="index.html" data-i18n="ui.nav.home"></a></li>
            <li class="service-breadcrumb__item"><span class="service-breadcrumb__current" aria-current="page" data-i18n="contact.page_title"></span></li>
          </ol>
        </nav>
        <header class="section-heading contact-heading" data-reveal>
          <h1 class="section-title" data-i18n="contact.page_title"></h1>
          <p class="section-lead" data-i18n="contact.lead"></p>
          <p class="contact-response" data-i18n="contact.response_note"></p>
        </header>
        <div class="contact-layout">
          <div class="contact-main">
            <form id="contact-form-control" class="contact-form card" data-contact-form novalidate>
              <h2 class="contact-card__title" data-i18n="contact.form.title"></h2>
              <div class="contact-fields" data-contact-fields>
                <label class="contact-field"><span data-i18n="contact.form.fields.name"></span><span class="contact-required" data-i18n="contact.form.required"></span><input name="name" autocomplete="name" required></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.company"></span><span class="contact-optional" data-i18n="contact.form.optional"></span><input name="company" autocomplete="organization"></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.department"></span><span class="contact-optional" data-i18n="contact.form.optional"></span><input name="department"></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.position"></span><span class="contact-optional" data-i18n="contact.form.optional"></span><input name="position"></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.email"></span><span class="contact-required" data-i18n="contact.form.required"></span><input name="email" type="email" autocomplete="email" required></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.phone"></span><span class="contact-optional" data-i18n="contact.form.optional"></span><input name="phone" type="tel" autocomplete="tel"></label>
                <label class="contact-field"><span data-i18n="contact.form.fields.type"></span><span class="contact-required" data-i18n="contact.form.required"></span><select name="type" required data-contact-types></select></label>
                <label class="contact-field contact-field--wide"><span data-i18n="contact.form.fields.message"></span><span class="contact-required" data-i18n="contact.form.required"></span><textarea name="message" rows="6" required></textarea></label>
                <label class="contact-honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
                <div class="contact-error" data-contact-error role="alert" hidden></div>
                <button class="button button--primary" type="submit" data-contact-review-button></button>
              </div>
              <section class="contact-review" data-contact-review hidden aria-live="polite">
                <h3 tabindex="-1" data-i18n="contact.form.review_title"></h3>
                <dl data-contact-review-values></dl>
                <div class="contact-review__actions">
                  <button class="button button--secondary" type="button" data-contact-edit></button>
                  <button class="button button--primary" type="button" data-contact-send></button>
                </div>
              </section>
              <p class="contact-result" data-contact-result role="status" hidden></p>
              <a class="button button--secondary" data-contact-mailto hidden></a>
            </form>
            <section class="contact-privacy card" aria-labelledby="contact-privacy-title">
              <h2 id="contact-privacy-title" data-i18n="contact.privacy.title"></h2>
              <p data-i18n="contact.privacy.intro"></p>
              <dl class="contact-privacy__list" data-contact-privacy></dl>
              <label class="contact-consent"><input type="checkbox" form="contact-form-control" data-contact-consent><span data-i18n="contact.form.consent_label"></span><span class="contact-required" data-i18n="contact.form.required"></span></label>
              <p class="contact-consent-error" data-contact-consent-error role="alert" hidden></p>
            </section>
          </div>
          <aside class="contact-company card">
            <img class="contact-company__logo" data-img="company_logo" alt="">
            <h2 data-i18n="contact.company_panel.title"></h2>
            <p class="contact-company__name" data-i18n="ui.brand.dept_full"></p>
            <div class="contact-company__offices" data-contact-offices></div>
            <a class="contact-company__line" data-contact-email hidden></a>
            <div class="contact-callout" data-contact-phone-wrap hidden>
              <h3 data-i18n="contact.company_panel.call_title"></h3>
              <a data-contact-phone></a>
            </div>
            <a class="contact-company__map" data-contact-map hidden target="_blank" rel="noopener noreferrer" data-i18n="contact.labels.map"></a>
            <div class="contact-company__social" data-contact-socials></div>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
