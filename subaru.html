<!doctype html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUBARU | BRYCEN VIETNAM BPO</title>
  <meta name="description" content="Khám phá Subaru, đối tác chính của BRYCEN VIETNAM trong lĩnh vực dữ liệu học cho AI.">
  <link rel="canonical" href="https://example.com/subaru.html?lang=vi">
  <link rel="alternate" hreflang="vi" href="https://example.com/subaru.html?lang=vi">
  <link rel="alternate" hreflang="en" href="https://example.com/subaru.html?lang=en">
  <link rel="alternate" hreflang="ja" href="https://example.com/subaru.html?lang=ja">
  <link rel="alternate" hreflang="x-default" href="https://example.com/subaru.html?lang=vi">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BRYCEN VIETNAM – BPO">
  <meta property="og:title" content="SUBARU | BRYCEN VIETNAM BPO">
  <meta property="og:description" content="Khám phá Subaru, đối tác chính của BRYCEN VIETNAM trong lĩnh vực dữ liệu học cho AI.">
  <meta property="og:url" content="https://example.com/subaru.html?lang=vi">
  <meta property="og:image" content="https://example.com/assets/images/common/og_share.jpg" data-image-slot="og_share">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ảnh chia sẻ mạng xã hội">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SUBARU | BRYCEN VIETNAM BPO">
  <meta name="twitter:description" content="Khám phá Subaru, đối tác chính của BRYCEN VIETNAM trong lĩnh vực dữ liệu học cho AI.">
  <meta name="twitter:image" content="https://example.com/assets/images/common/og_share.jpg" data-image-slot="og_share">
  <meta name="twitter:image:alt" content="Ảnh chia sẻ mạng xã hội">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/images/common/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/common/browser_logo_32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/common/browser_logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/common/browser_logo_180.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="subaru">
  <div id="site-header"></div>
  <main id="main" class="subaru-page">
    <section class="section-shell subaru-hero">
      <div class="page-container">
        <nav class="service-breadcrumb" aria-label="Breadcrumb">
          <ol class="service-breadcrumb__list">
            <li class="service-breadcrumb__item"><a href="index.html" data-i18n="ui.nav.home"></a></li>
            <li class="service-breadcrumb__item"><span data-i18n="ui.partner_main"></span></li>
            <li class="service-breadcrumb__item"><span class="service-breadcrumb__current" data-i18n="subaru.page_title"></span></li>
          </ol>
        </nav>

        <div class="subaru-hero__panel" data-reveal>
          <div class="subaru-hero__media">
            <img class="subaru-hero__image" data-img="subaru_hero" loading="eager">
          </div>
          <div class="subaru-hero__content">
            <p class="eyebrow" data-i18n="subaru.hero.eyebrow"></p>
            <h1 class="section-title" data-i18n="subaru.hero.title"></h1>
            <p class="section-lead subaru-hero__subtitle" data-i18n="subaru.hero.subtitle"></p>
            <img class="subaru-hero__logo" data-img="subaru_logo" loading="lazy" alt="SUBARU">
          </div>
        </div>
      </div>
    </section>

    <section class="section-shell subaru-intro" aria-labelledby="subaru-intro-title">
      <div class="page-container">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="subaru.page_title"></p>
          <h2 id="subaru-intro-title" class="section-title" data-i18n="subaru.intro.title"></h2>
        </header>

        <div class="subaru-intro__grid">
          <article class="subaru-intro__block" data-reveal>
            <img class="subaru-intro__image" data-img="subaru_intro_history" loading="lazy">
            <div class="subaru-intro__body">
              <h3 data-i18n="subaru.intro.history.title"></h3>
              <p data-i18n="subaru.intro.history.text"></p>
            </div>
          </article>

          <article class="subaru-intro__block" data-reveal>
            <img class="subaru-intro__image" data-img="subaru_intro_global" loading="lazy">
            <div class="subaru-intro__body">
              <h3 data-i18n="subaru.intro.global.title"></h3>
              <p data-i18n="subaru.intro.global.text"></p>
              <p class="subaru-intro__source" data-i18n="subaru.intro.global.source"></p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section class="section-shell subaru-tech" aria-labelledby="subaru-tech-title">
      <div class="page-container">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="subaru.page_title"></p>
          <h2 id="subaru-tech-title" class="section-title" data-i18n="subaru.tech.title"></h2>
          <p class="section-lead" data-i18n="subaru.tech.lead"></p>
        </header>
        <div id="subaru-tech-list" class="subaru-tech__list" aria-live="polite"></div>
      </div>
    </section>

    <section class="section-shell subaru-cta">
      <div class="page-container">
        <div class="subaru-cta__panel" data-reveal>
          <div>
            <p class="eyebrow" data-i18n="subaru.page_title"></p>
            <h2 data-i18n="subaru.cta.title"></h2>
          </div>
          <a class="button" href="contact.html" data-i18n="subaru.cta.button"></a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    function renderSubaruTech() {
      const root = document.querySelector('#subaru-tech-list');
      const context = window.siteI18n;
      if (!root || !context) {
        return;
      }

      const items = Array.isArray(context.t('subaru.tech.items')) ? context.t('subaru.tech.items') : [];
      root.replaceChildren();

      items.forEach((item) => {
        const article = document.createElement('article');
        article.className = `subaru-tech__item${item.highlight ? ' is-highlighted' : ''}`;

        const imageWrap = document.createElement('div');
        imageWrap.className = 'subaru-tech__image';
        const image = document.createElement('img');
        const slot = context.images?.slots?.[item.image];
        if (slot) {
          image.src = slot.src;
          image.alt = slot.alt?.[context.language] ?? slot.alt?.vi ?? '';
          if (slot.placeholder) {
            image.classList.add('is-placeholder');
            image.dataset.placeholderLabel = context.t('ui.image_placeholder');
          }
          if (Number.isInteger(slot.width) && Number.isInteger(slot.height)) {
            image.width = slot.width;
            image.height = slot.height;
          }
          image.loading = 'lazy';
        }
        imageWrap.append(image);

        const body = document.createElement('div');
        body.className = 'subaru-tech__body';

        const header = document.createElement('div');
        header.className = 'subaru-tech__header';

        if (item.highlight && item.partnership_badge) {
          const badge = document.createElement('span');
          badge.className = 'subaru-tech__badge';
          badge.textContent = item.partnership_badge;
          header.append(badge);
        }

        const title = document.createElement('h3');
        title.className = 'subaru-tech__title';
        title.textContent = item.name ?? '';
        header.append(title);
        body.append(header);

        const text = document.createElement('p');
        text.className = 'subaru-tech__text';
        text.textContent = item.text ?? '';
        body.append(text);

        if (item.highlight && item.partnership) {
          const partnership = document.createElement('p');
          partnership.className = 'subaru-tech__partnership';
          partnership.textContent = item.partnership;
          body.append(partnership);
        }

        if (item.highlight && item.partnership_image) {
          const extraWrap = document.createElement('div');
          extraWrap.className = 'subaru-tech__partnership-image';
          const extraImage = document.createElement('img');
          const extraSlot = context.images?.slots?.[item.partnership_image];
          if (extraSlot) {
            extraImage.src = extraSlot.src;
            extraImage.alt = extraSlot.alt?.[context.language] ?? extraSlot.alt?.vi ?? '';
            if (extraSlot.placeholder) {
              extraImage.classList.add('is-placeholder');
              extraImage.dataset.placeholderLabel = context.t('ui.image_placeholder');
            }
            extraImage.loading = 'lazy';
          }
          extraWrap.append(extraImage);
          body.append(extraWrap);
        }

        article.append(imageWrap, body);
        root.append(article);
      });
    }

    document.addEventListener('langchange', renderSubaruTech);
    window.addEventListener('DOMContentLoaded', renderSubaruTech);
    renderSubaruTech();
  </script>
</body>
</html>
