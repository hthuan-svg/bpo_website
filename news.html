<!-- News page shell. -->
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="description" content="">
  <link rel="icon" href="assets/images/branding/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/branding/browser_logo_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/branding/browser_logo_180.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="news">
  <div id="site-header"></div>
  <main id="main" class="news-page">
    <section class="news-section section">
      <div class="container">
        <header class="section-heading news-heading" data-reveal>
          <h1 class="section-title" data-i18n="news.page_title"></h1>
          <p class="section-lead" data-i18n="news.lead"></p>
        </header>
        <div class="news-layout">
          <div class="news-content">
            <section data-news-list-view aria-label="">
              <div class="news-filters" data-news-filters role="group"></div>
              <div class="news-grid" data-news-cards></div>
              <p class="news-empty" data-news-empty role="status" hidden></p>
              <button class="button button--secondary news-show-more" type="button" data-news-show-more hidden></button>
            </section>
            <article class="news-detail card" data-news-detail hidden></article>
          </div>
          <aside class="news-sidebar" data-news-sidebar>
            <section class="news-facebook" data-facebook-plugin hidden>
              <h2 class="news-facebook__title" data-i18n="news.facebook_title"></h2>
              <iframe data-facebook-frame loading="lazy" title=""></iframe>
              <a class="news-facebook__fallback" data-facebook-link data-i18n="contact.facebook_link" target="_blank" rel="noopener noreferrer" hidden></a>
            </section>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
