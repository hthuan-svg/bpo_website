<body data-page="team">
  <div id="site-header"></div>
  <main id="main" class="content-page team-page">
    <div class="page-container">
      <nav class="team-tabs" aria-label="Team sections">
        <div class="team-tabs__list" role="tablist" aria-label="Team sections">
          <button class="team-tabs__tab is-active" type="button" role="tab" aria-selected="true" aria-current="page" data-target="#org">
            <span data-i18n="team.tabs.org"></span>
          </button>
          <button class="team-tabs__tab" type="button" role="tab" aria-selected="false" data-target="#process">
            <span data-i18n="team.tabs.process"></span>
          </button>
          <button class="team-tabs__tab" type="button" role="tab" aria-selected="false" data-target="#people">
            <span data-i18n="team.tabs.people"></span>
          </button>
          <button class="team-tabs__tab" type="button" role="tab" aria-selected="false" data-target="#recruit">
            <span data-i18n="team.tabs.recruit"></span>
          </button>
        </div>
      </nav>
    </div>

    <section id="org" class="section-shell team-org" aria-labelledby="team-org-title">
      <div class="page-container">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="team.page_title"></p>
          <h1 class="section-title" id="team-org-title" data-i18n="team.org.title"></h1>
          <p class="section-lead" data-i18n="team.org.lead"></p>
        </header>
        <div class="team-org__overview" data-reveal>
          <div class="team-org__stat">
            <strong class="content-stat__value" data-i18n="team.org.headcount.value"></strong>
            <span class="content-stat__label" data-i18n="team.org.headcount.label"></span>
            <p class="team-org__detail" data-i18n="team.org.headcount.detail"></p>
          </div>
        </div>
        <div id="team-org-chart" class="team-org__chart" aria-live="polite"></div>
      </div>
    </section>

    <section id="process" class="section-shell team-process" aria-labelledby="team-process-title">
      <div class="page-container">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="team.page_title"></p>
          <h2 class="section-title" id="team-process-title" data-i18n="team.process.title"></h2>
          <p class="section-lead" data-i18n="team.process.lead"></p>
        </header>
        <div id="team-process-chart" class="team-process__chart" aria-live="polite"></div>
      </div>
    </section>

    <section id="people" class="section-shell team-people" aria-labelledby="team-people-title">
      <div class="page-container">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="team.page_title"></p>
          <h2 class="section-title" id="team-people-title" data-i18n="team.people.title"></h2>
          <p class="section-lead" data-i18n="team.people.lead"></p>
        </header>
        <div class="team-people__timeline" data-list="team.people.steps" data-reveal>
          <template>
            <article class="team-people__step">
              <div class="team-people__step-marker" aria-hidden="true"></div>
              <div class="team-people__step-content">
                <h3 class="team-people__step-title" data-field="title"></h3>
                <p class="team-people__step-text" data-field="text"></p>
              </div>
            </article>
          </template>
        </div>
        <ul class="team-people__images" data-list="team.people.images" data-reveal>
          <template>
            <li><img class="team-people__image" data-img-field="." loading="lazy"></li>
          </template>
        </ul>
      </div>
    </section>

    <section id="recruit" class="section-shell team-recruit" aria-labelledby="team-recruit-title">
      <div class="page-container team-recruit__layout">
        <div class="team-recruit__content" data-reveal>
          <header class="section-heading">
            <p class="eyebrow" data-i18n="team.page_title"></p>
            <h2 class="section-title" id="team-recruit-title" data-i18n="team.recruit.title"></h2>
          </header>
          <p class="section-lead" data-i18n="team.recruit.text"></p>
          <a class="button button--primary team-recruit__cta" href="contact.html" data-i18n="home.cta.button"></a>
        </div>
        <ul class="team-recruit__stats" data-list="team.recruit.stats" data-reveal>
          <template>
            <li class="team-recruit__stat">
              <strong class="content-stat__value" data-field="value"></strong>
              <span class="content-stat__label" data-field="label"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
