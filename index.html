<!-- Home page for the BRYCEN VIETNAM BPO division. -->
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="description" content="">
  <link rel="icon" href="assets/images/branding/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/branding/browser_logo_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/branding/browser_logo_180.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="index">
  <div id="site-header"></div>
  <main id="main" class="home-page">
    <section class="home-hero" data-bg="background_main">
      <div class="home-hero__content page-container" data-reveal>
        <p class="home-hero__eyebrow" data-i18n="home.hero.eyebrow"></p>
        <h1 data-i18n="home.hero.title"></h1>
        <p class="home-hero__subtitle" data-i18n="home.hero.subtitle"></p>
        <div class="home-hero__actions">
          <a class="button button--primary" href="services.html" data-i18n="home.hero.cta_primary"></a>
          <a class="button button--secondary" href="contact.html" data-i18n="home.hero.cta_secondary"></a>
        </div>
      </div>
    </section>

    <section class="home-stats section-shell">
      <ul class="home-stats__list page-container" data-list="home.stats">
        <template>
          <li class="home-stats__item">
            <strong class="home-stats__value" data-field="value" data-count-up></strong>
            <span class="home-stats__label" data-field="label"></span>
          </li>
        </template>
      </ul>
      <p class="home-stats__note page-container" data-i18n="home.stats_note"></p>
    </section>

    <section class="home-section section-shell page-container" data-reveal>
      <h2 class="home-section__title" data-i18n="home.pillars_title"></h2>
      <div class="home-pillars" data-list="home.pillars">
        <template>
          <a class="home-pillar-card" data-link-field="link">
            <img class="home-pillar-card__image" data-img-field="image" loading="lazy">
            <span class="home-pillar-card__body">
              <strong class="home-pillar-card__title" data-field="title"></strong>
              <span class="home-pillar-card__text" data-field="text"></span>
              <span class="home-pillar-card__arrow" aria-hidden="true">↗</span>
            </span>
          </a>
        </template>
      </div>
    </section>

    <section class="home-commitments section-shell">
      <div class="page-container" data-reveal>
        <h2 class="home-section__title" data-i18n="home.commitments_title"></h2>
        <div class="home-commitments__grid" data-list="home.commitments">
          <template>
            <article class="home-commitment">
              <svg class="home-commitment__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <path d="M24 5 39 11v11c0 10-6.4 17-15 21C15.4 39 9 32 9 22V11l15-6Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="m17 23 5 5 10-11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <h3 data-field="title"></h3>
              <p data-field="text"></p>
            </article>
          </template>
        </div>
      </div>
    </section>

    <section class="home-customers section-shell page-container" data-reveal>
      <h2 class="home-section__title" data-i18n="home.customers_title"></h2>
      <ul class="home-customers__list" data-list="achievements.projects.customers">
        <template>
          <li><img class="home-customers__logo" data-img-field="." loading="lazy"></li>
        </template>
      </ul>
    </section>

    <section class="home-news section-shell page-container" data-reveal>
      <h2 class="home-section__title" data-i18n="home.news_title"></h2>
      <div id="home-news"></div>
    </section>

    <section class="home-cta-band">
      <div class="home-cta-band__inner page-container" data-reveal>
        <div>
          <h2 data-i18n="home.cta.title"></h2>
          <p data-i18n="home.cta.text"></p>
        </div>
        <a class="button button--primary" href="contact.html" data-i18n="home.cta.button"></a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
