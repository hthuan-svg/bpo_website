  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/common/browser_logo.png">

  <link rel="stylesheet" href="assets/css/tokens.css">

</head>
<body data-page="vision">
  <div id="site-header"></div>
  <main id="main" class="content-page vision-page">
    <section class="section-shell vision-direction">
      <div class="page-container vision-direction__layout">
        <header class="section-heading" data-reveal>
          <p class="eyebrow" data-i18n="vision.page_title"></p>
          <h1 class="section-title" data-i18n="vision.direction.title"></h1>
          <p class="section-lead" data-i18n="vision.direction.text"></p>
        </header>
        <img class="vision-direction__image" data-content-image="vision.direction.image" loading="lazy">
      </div>
    </section>

    <section class="section-shell vision-growth" aria-labelledby="vision-growth-title">
      <div class="page-container">
        <header class="section-heading vision-growth__heading" data-reveal>
          <p class="eyebrow" data-i18n="vision.page_title"></p>
          <h2 id="vision-growth-title" class="section-title" data-i18n="vision.growth.title"></h2>
          <p class="section-lead" data-i18n="vision.growth.lead"></p>
        </header>
        <div id="vision-growth-list" class="vision-growth__timeline" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <dialog class="vision-lightbox" aria-labelledby="vision-lightbox-title">
    <form class="vision-lightbox__form" method="dialog">
      <h2 id="vision-lightbox-title" class="sr-only" data-i18n="vision.growth.title"></h2>
      <button class="vision-lightbox__close" type="submit" data-i18n-attr="aria-label:ui.close_image"><span aria-hidden="true">×</span></button>
      <img id="vision-lightbox-image" class="vision-lightbox__image" src="" alt="" loading="eager" width="1200" height="800">
    </form>
  </dialog>

  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    const timelineList = document.querySelector('#vision-growth-list');
    const lightbox = document.querySelector('.vision-lightbox');
    const lightboxImage = document.querySelector('#vision-lightbox-image');

    function createElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) {
        element.className = className;
      }
      if (text !== undefined) {
        element.textContent = String(text);
      }
      return element;
    }

    function buildImage(slotName, context, className = 'vision-growth__image') {
      const slot = context.images?.slots?.[slotName];
      if (!slot) {
        return null;
      }

      const image = document.createElement('img');
      image.src = slot.src;
      image.alt = slot.alt?.[context.language] ?? slot.alt?.vi ?? '';
      if (slot.placeholder) {
        image.classList.add('is-placeholder');
        image.dataset.placeholderLabel = context.t('ui.image_placeholder');
      }
      if (Number.isInteger(slot.width) && Number.isInteger(slot.height)) {
        image.width = slot.width;
        image.height = slot.height;
      }
      image.loading = 'lazy';
      image.className = className;
      return image;
    }

    function renderVisionGrowth() {
      const context = window.siteI18n;
      if (!context || !timelineList) {
        return;
      }

      const stages = Array.isArray(context.t('vision.growth.stages'))
        ? context.t('vision.growth.stages')
        : [];

      timelineList.replaceChildren();

      stages.forEach((stage, index) => {
        const article = createElement('article', 'vision-growth__stage');
        article.style.setProperty('--stage-level', String(stage.level ?? index + 1));
        if (stage.featured) {
          article.classList.add('is-featured');
        }
        const heading = createElement('div', 'vision-growth__stage-heading');
        heading.append(
          createElement('p', 'vision-growth__phase', stage.phase ?? ''),
          createElement('h3', 'vision-growth__title', stage.title ?? '')
        );

        if (Array.isArray(stage.regions)) {
          const regions = createElement('div', 'vision-growth__regions');
          stage.regions.forEach((region) => {
            const card = createElement('article', 'vision-growth__region');
            const image = buildImage(region.image, context, 'vision-growth__image');
            const title = createElement('h4', 'vision-growth__region-title', region.title ?? '');
            const text = createElement('p', 'vision-growth__text', region.text ?? '');
            if (image) card.append(image);
            card.append(title, text);
            if (Array.isArray(region.countries) && region.countries.length) {
              const countries = createElement('ul', 'vision-growth__countries');
              region.countries.forEach((country) => countries.append(createElement('li', 'vision-growth__country', country)));
              card.append(countries);
            }
            regions.append(card);
          });
          article.append(heading, regions);
        } else {
          const text = createElement('p', 'vision-growth__text', stage.text ?? '');
          const media = createElement('button', 'vision-growth__image-button');
          media.type = 'button';
          media.setAttribute('aria-label', stage.title ?? '');
          media.dataset.slot = stage.image ?? '';
          const image = buildImage(stage.image, context);
          if (image) media.append(image);
          if (stage.id === 'next') media.dataset.lightboxTrigger = 'usa';
          article.append(heading, text, media);
        }
        timelineList.append(article);
      });

    }

    function openUsaImage(event) {
      const trigger = event.target.closest('[data-lightbox-trigger="usa"]');
      const context = window.siteI18n;
      if (!trigger || !context || !lightbox || !lightboxImage) return;
      const slot = context.images?.slots?.[trigger.dataset.slot];
      if (!slot) return;
      lightboxImage.src = slot.src;
      lightboxImage.alt = slot.alt?.[context.language] ?? slot.alt?.vi ?? '';
      lightboxImage.width = Number.isInteger(slot.width) ? slot.width : 1200;
      lightboxImage.height = Number.isInteger(slot.height) ? slot.height : 800;
      if (slot.placeholder) {
        lightboxImage.classList.add('is-placeholder');
        lightboxImage.dataset.placeholderLabel = context.t('ui.image_placeholder');
      } else {
        lightboxImage.classList.remove('is-placeholder');
        delete lightboxImage.dataset.placeholderLabel;
      }
      if (typeof lightbox.showModal === 'function') lightbox.showModal();
      else lightbox.setAttribute('open', 'open');
    }

    function ensureVisionGrowth() {
      if (window.siteI18n) {
        renderVisionGrowth();
        return;
      }
      requestAnimationFrame(ensureVisionGrowth);
    }

    timelineList?.addEventListener('click', openUsaImage);
    document.addEventListener('langchange', renderVisionGrowth);
    ensureVisionGrowth();
  </script>
</body>
</html>
